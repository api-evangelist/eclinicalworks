apis:
- aid: eclinicalworks:eclinicalworks-fhir-api
  name: eClinicalWorks FHIR API
  description: Provider-centric, backend and bulk FHIR R4 APIs for integrating with the eClinicalWorks
    EHR. Supports SMART on FHIR EHR Launch, Standalone Launch, Backend Services (private_key_jwt, RS384)
    and CDS Hooks. The live CapabilityStatement declares 36 resource types with read/search-type interactions,
    create on QuestionnaireResponse, and the system-level $export operation for Group-scoped bulk data.
    Base URLs are tenant-scoped by practice code; the ONC-required service base URL directory lists 17,229
    activated endpoints.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
