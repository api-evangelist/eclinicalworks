aid: eclinicalworks
name: eClinicalWorks
description: 'eClinicalWorks is a cloud-based EHR and practice-management platform serving more than 180,000
  physicians and 850,000 medical professionals. Its API surface is standards-based rather than proprietary:
  FHIR R4 served by the eCW FHIR Facade behind SMART on FHIR and OAuth 2.0, split across a provider-facing
  facade (fhir4.eclinicalworks.com) and a patient-facing healow facade (fhir4.healow.com), each tenant-scoped
  by a six-character practice code. eClinicalWorks publishes no OpenAPI; the machine-readable contract
  is the FHIR CapabilityStatement at each tenant''s /metadata plus the SMART configuration at /.well-known/smart-configuration,
  which advertises 486 scopes. Capabilities include SMART EHR Launch and Standalone Launch, Backend Services
  with Group/$export bulk data, CDS Hooks, a documented writeback catalogue, patient-facing healow Clinical
  and Scheduling APIs, and a bidirectional healow RPM Vendor (Tracker) API for remote-monitoring device
  orders and observations. APIs are certified to the ONC 45 CFR 170.315(g)(10) Standardized API for Patient
  and Population Services criterion.'
