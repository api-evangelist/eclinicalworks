- aid: eclinicalworks:healow-fhir-api
  name: healow Patient-Centric FHIR API
  description: Patient-facing FHIR R4 APIs accessible through the healow developer portal, letting third-party
    applications connect to the healow network for clinical data and scheduling. Served by the same eCW
    FHIR Facade build and the same authorization server as the provider-facing API, with 17,291 activated
    practice endpoints published in the healow service base URL directory. Read scopes conform to US Core
    3.1.1 (USCDI v1) and US Core 6.1.0 (USCDI v3). A published FHIR rate limit of 250 calls per minute
    per practice-code base URL took effect 7 October 2025.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://connect4.healow.com/apps/jsp/dev/r4/fhirClinicalDocumentation.jsp
  baseURL: https://fhir4.healow.com/fhir/r4/{practice_code}
