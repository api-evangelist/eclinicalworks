writeback_note: 'The CapabilityStatement declares create only on QuestionnaireResponse. The developer portal separately documents
  a much larger writeback surface (Patient, AllergyIntolerance, Condition, Coverage, DocumentReference, Encounter, Immunization,
  MedicationRequest, Observation, Procedure, ServiceRequest, ChargeItem, Communication, Task and more) whose availability
  is gated per practice and per EHR build. The gap between the declared CapabilityStatement and the documented writeback catalogue
  is itself a finding: an agent that trusts /metadata alone will under-estimate the write surface, and one that trusts the
  docs alone will over-estimate it for a given tenant.'
documented_writeback_resources:
- AllergyIntolerance
- ChargeItem
- Communication
- Condition (Encounter Diagnosis)
- Condition (Problems)
- Coverage (create/update/delete)
- DocumentReference (C-CDA, Clinical Notes, Insurance Card & Govt ID, PDF)
- Encounter (Telephone, Web)
- Immunization
- MedicationAdministration (Therapeutic Injection)
- MedicationRequest
- MedicationStatement
- Observation (Vital Signs)
- Organization (delete patient pharmacy)
- Patient (create/update)
- Procedure (Surgical History)
- QuestionnaireResponse
- ServiceRequest (Lab/DI/Procedure, Referrals)
- Task
