format: proprietary-numeric-plus-fhir-operationoutcome
guide:
  title: Error Code Reference Guide
  version: '1.0'
  last_updated: 2026-07
  support: fhirfighters@eclinicalworks.com
  purpose: Maps writeback error codes to a payload correction action for FHIR vendors.
envelope:
  field: status
  note: 'Writeback (create/update/delete) responses carry a numeric error code in `status` plus an error key. Read/search
    errors are returned as FHIR OperationOutcome (application/fhir+json). OAuth token errors use the OAuth 2.0 error JSON
    envelope {"error": "...", "error_description": "..."}.'
response_handling:
- Treat validation errors as fix-and-resubmit cases.
- Retry transient/infrastructure errors once (for example unknown module / internal processing failures).
- Re-submit only corrected resources when possible.
summary:
  writeback_code_count: 92
  hl7_interface_code_count: 8
  oauth_error_count: 5
  note: Codes 615 appear twice in the published guide (UPDATE_NOT_SUPPORTED_REFERRAL and INVALID_ORGNIZATION_ID); both are
    recorded verbatim.
