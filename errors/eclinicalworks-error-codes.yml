oauth_errors:
- error: invalid_client
  http_status: 401
  description: No client_id found, client_id mismatch, kid in the JWKS URL does not match the kid in client_assertion, JWKS
    URL unreachable/malformed, or JWKS URL not allow-listed by eClinicalWorks.
- error: unsupported_grant_type
  http_status: 400
  description: A value other than client_credentials was sent for grant_type.
- error: invalid_grant
  http_status: 400
  description: The requested scope is not supported, invalid, unknown, or malformed (or the client_assertion is expired/malformed).
- error: invalid_request
  http_status: 400
  description: The authorization request is missing a required parameter, includes an unsupported parameter value, or repeats
    a parameter.
- error: access_denied
  http_status: 500
  description: Any other authorization-server error not covered above.
bulk_export_statuses:
- status: 202
  meaning: 'Export job accepted or in progress. Poll the content-location; honour retry-after (documented example: 120s) and
    x-progress.'
- status: 200
  meaning: Export job complete; body carries transactionTime, request, requiresAccessToken, output[] and error[] NDJSON URLs.
- status: 401
  meaning: Access token invalid or expired, OR the group id is invalid/unauthorized.
- status: 404
  meaning: JobId is invalid.
runtime_statuses:
- status: 401
  meaning: 'Unauthenticated FHIR resource request. Observed live: GET https://fhir4.eclinicalworks.com/fhir/r4/{practice_code}/Patient
    without a bearer token returns 401 with an application/fhir+json OperationOutcome.'
- status: 429
  meaning: Rate limit exceeded — see rate-limits/eclinicalworks-rate-limits.yml. All requests from the application are blocked
    for the remainder of the minute.
