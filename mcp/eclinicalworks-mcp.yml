note: 'eClinicalWorks advertises an MCP server on its own marketing host through RFC 9728 protected-resource metadata and
  RFC 8414 authorization-server metadata, both served as real application/json documents. The MCP resource itself could NOT
  be exercised anonymously: every request to the WordPress REST namespace — including the advertised MCP path — is rejected
  at the edge by a security plugin with HTTP 404 {"code":"nfw_rest_api_access_restricted","message":"Forbidden access"}. That
  is consistent with an auth-gated MCP server, but it means the tool list and input schemas could not be enumerated. NO tool
  list is recorded, because none was observed. This is the marketing/content site, not the FHIR API — there is no MCP surface
  over the clinical APIs.'
