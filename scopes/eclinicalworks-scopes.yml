  v1/v2 scope grammar; the identity and launch-context descriptions are taken from the eClinicalWorks
  "Scopes Supported by eClinicalWorks" documentation page. Both SMART v1 (.read/.write) and SMART v2 (.rs/.c/.u/.d/.cruds)
  forms are advertised (capabilities include permission-v1 and permission-v2).
